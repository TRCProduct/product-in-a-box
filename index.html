<style>
/* Sign-in screen: shown until the right user ID and password unlock the page */
:root {
  --lk-bg: #F4F7FA; --lk-tile: #FFFFFF; --lk-ink: #0F2233; --lk-muted: #52667A; --lk-line: #D3DEE8;
  --lk-accent: #0B6E99; --lk-on: #FFFFFF; --lk-err: #C2502E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lk-bg: #0E1822; --lk-tile: #172433; --lk-ink: #E4ECF3; --lk-muted: #93A6B8; --lk-line: #263749; --lk-accent: #5FB4DD; --lk-on: #06131C; --lk-err: #F08B6B; }
}
:root[data-theme="dark"] { --lk-bg: #0E1822; --lk-tile: #172433; --lk-ink: #E4ECF3; --lk-muted: #93A6B8; --lk-line: #263749; --lk-accent: #5FB4DD; --lk-on: #06131C; --lk-err: #F08B6B; }
body { background: var(--lk-bg); color: var(--lk-ink); margin: 0; }
.lk { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; }
.lk[hidden] { display: none; }
.lk-card { width: min(380px, 100%); background: var(--lk-tile); border: 1px solid var(--lk-line); border-radius: 18px; padding: 28px 24px 24px; display: grid; gap: 14px; box-sizing: border-box; }
.lk-eyebrow { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--lk-muted); }
.lk h1 { font-family: "Bricolage Grotesque", "Segoe UI", sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -0.01em; margin: 2px 0 0; }
.lk p { margin: 0; font-size: 14.5px; color: var(--lk-muted); }
.lk label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--lk-muted); }
.lk input { font: inherit; font-size: 15px; color: var(--lk-ink); background: var(--lk-bg); border: 1px solid var(--lk-line); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
.lk input:focus { outline: 2px solid var(--lk-accent); outline-offset: 0; border-color: var(--lk-accent); }
.lk button { appearance: none; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: 0; border-radius: 999px; padding: 11px 18px; background: var(--lk-accent); color: var(--lk-on); margin-top: 4px; }
.lk button[disabled] { opacity: .6; cursor: default; }
.lk-err { min-height: 1.3em; font-size: 13.5px; color: var(--lk-err); }
</style>

  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem("pib-auth") || "null"); } catch (e) {}
  if (saved && saved.length === 2) {
    attempt(saved[0], saved[1], false).catch(function () { try { sessionStorage.removeItem("pib-auth"); } catch (e) {} userIn.focus(); });
  } else {
    userIn.focus();
  }
})();
</script>
